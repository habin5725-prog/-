<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 검색에 잡히지 않도록 합니다. 이 페이지를 복사해 쓸 때도 이 줄은 지우지 마세요. -->
  <meta name="robots" content="noindex, nofollow">
  <title>가족 영상 | 캡챠(CAPCHA)</title>
  <meta name="theme-color" content="#222222">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/noto-serif-kr-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/main.js" defer></script>
</head>
<body>
  <!--
    가족 영상 페이지 템플릿
    1. 이 파일을 추측하기 어려운 이름으로 복사합니다. (예: family/k7m2q9x4w8pd.html · README 참고)
    2. [유튜브 ID] 두 곳과 [영상 제목] 두 곳을 바꿉니다.
    3. 유튜브 영상은 '일부 공개'로 올립니다.
  -->
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="site-header on-dark" id="top">
    <div class="header-inner">
      <a class="logo" href="../index.html" aria-label="캡챠 CAPCHA 처음 화면">
        <span class="logo-en" lang="en">CAPCHA</span>
        <span class="logo-ko">캡챠</span>
      </a>
    </div>
  </header>

  <main id="main">
    <section class="page-hero page-hero-sm on-dark" aria-labelledby="page-title">
      <div class="media media-cover">
        <div class="ph ph-dark" aria-hidden="true"></div>
      </div>
      <div class="page-hero-content">
        <p class="eyebrow" lang="en">Family Film</p>
        <h1 class="sec-title" id="page-title"><span class="ko">[영상 제목]</span></h1>
        <p class="sec-desc">책 속 QR로 여는 가족 영상 페이지입니다.</p>
      </div>
    </section>

    <section class="section" aria-label="인터뷰 영상">
      <div class="container container-narrow">
        <div class="video-wrap">
          <!-- 유튜브 개인정보 보호 강화 모드(youtube-nocookie.com) 주소입니다. -->
          <iframe
            src="https://www.youtube-nocookie.com/embed/[유튜브 ID]?rel=0"
            title="[영상 제목] 인터뷰 영상"
            allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
            loading="lazy"></iframe>
        </div>
        <p class="video-links">영상이 보이지 않으면 <a href="https://www.youtube.com/watch?v=[유튜브 ID]">유튜브에서 바로 보기</a></p>

        <div class="notice">
          <h2 class="sr-only">안내</h2>
          <p>이 페이지 주소를 아는 사람은 누구나 영상을 볼 수 있습니다. 주소와 QR은 가족끼리만 나눠 주세요.</p>
          <p>영상을 내리거나 바꾸고 싶으시면 <a href="mailto:[이메일]">[이메일]</a>로 알려 주세요.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="to-top" href="#top" lang="en" aria-label="맨 위로">TOP</a>
    <p class="footer-logo" lang="en">CAPCHA</p>
    <ul class="footer-links">
      <li><a class="is-strong" href="[처리방침 주소]">개인정보 처리방침</a></li>
      <li><a href="mailto:[이메일]">문의 [이메일]</a></li>
    </ul>
    <p class="copyright">© 2026 캡챠(CAPCHA). All rights reserved.</p>
  </footer>
</body>
</html>
