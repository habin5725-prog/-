<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>가족 영상 페이지 이름 만들기</title>
  <style>
    :root { --title: #222; --body: #666; --line: #e3e3e3; --amber: #d9a066; --amber-ink: #8a5a22; }
    body { margin: 0; padding: 40px 20px; background: #f5f5f5; color: var(--body); font: 15px/1.8 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; word-break: keep-all; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 28px; background: #fff; border-top: 3px solid var(--amber); }
    h1 { margin: 0 0 8px; font-size: 22px; color: var(--title); }
    .row { margin-top: 20px; }
    label, .lbl { display: block; margin: 0; font-weight: 700; color: var(--title); }
    output, code { display: block; margin-top: 6px; padding: 12px 14px; border: 1px solid var(--line); background: #fafafa; color: var(--title); font: 16px/1.5 Consolas, Menlo, monospace; overflow-wrap: anywhere; }
    input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px 14px; border: 1px solid #cfcfcf; font: inherit; color: var(--title); }
    button { margin-top: 24px; min-height: 48px; padding: 10px 28px; border: 1px solid var(--title); border-radius: 999px; background: var(--title); color: #fff; font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--amber-ink); outline-offset: 3px; }
    ol { padding-left: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>가족 영상 페이지 이름 만들기</h1>
    <p>이 파일은 내 컴퓨터에서만 여는 도구입니다. 사이트에 올리지 않습니다. 버튼을 누를 때마다 추측하기 어려운 12자리 이름을 새로 만듭니다.</p>

    <div class="row">
      <label for="domain">사이트 주소 (예: https://capcha.pages.dev)</label>
      <input id="domain" type="url" value="https://[사이트 주소]" autocomplete="off">
    </div>

    <div class="row">
      <p class="lbl" id="file-label">복사해서 만들 파일 이름</p>
      <output id="file" aria-labelledby="file-label"></output>
    </div>
    <div class="row">
      <p class="lbl" id="url-label">QR 코드에 넣을 주소</p>
      <output id="url" aria-labelledby="url-label"></output>
    </div>

    <button id="make" type="button">새 이름 만들기</button>

    <ol class="row">
      <li>site/family/sample.html 파일을 복사합니다.</li>
      <li>복사한 파일의 이름을 위의 파일 이름으로 바꿉니다.</li>
      <li>파일 안의 [유튜브 ID]와 [영상 제목]을 바꿉니다.</li>
      <li>Cloudflare Pages에 다시 올린 뒤 위 주소로 QR 코드를 만듭니다.</li>
    </ol>
  </main>
  <script>
    (function () {
      // 헷갈리기 쉬운 글자(0 o 1 l i)를 뺀 소문자와 숫자 31가지
      var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
      var domain = document.getElementById('domain');
      var file = document.getElementById('file');
      var url = document.getElementById('url');
      var current = '';

      function makeId(length) {
        var out = '';
        var buf = new Uint32Array(1);
        while (out.length < length) {
          crypto.getRandomValues(buf);
          // 고르게 뽑기 위해 나머지가 치우치는 구간은 버립니다.
          if (buf[0] >= Math.floor(4294967296 / chars.length) * chars.length) continue;
          out += chars[buf[0] % chars.length];
        }
        return out;
      }

      function render() {
        var base = domain.value.trim().replace(/\/+$/, '');
        file.textContent = 'family/' + current + '.html';
        url.textContent = base + '/family/' + current;
      }

      document.getElementById('make').addEventListener('click', function () {
        current = makeId(12);
        render();
      });
      domain.addEventListener('input', render);

      current = makeId(12);
      render();
    })();
  </script>
</body>
</html>
